[package]
name = "mn-client-support"
version = "2.0.0"
edition = "2024"
license = "MIT"
description = "Native MirrorNeuron runtime control client"

[dependencies]
async-stream = "0.3"
anyhow = "1"
regex = "1"
wrpc-transport = "0.28"
base64 = "0.22"
bytes = "1"
futures-util = "0.3"
http = "1"
percent-encoding = "2"
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "process", "time", "rt", "macros", "sync", "io-std", "rt-multi-thread"] }
tonic = "0.14"
tonic-prost = "0.14"
url = "2"

[build-dependencies]
protox = "0.9"
tonic-prost-build = "0.14"

[dependencies.wit-bindgen-wrpc]
version = "0.10"
