[project]
name = "mirrorneuron-surface"
version = "1.4.23"
description = "Python application client for MirrorNeuron runtime nodes"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mirrorneuron-sdk-contracts>=1.4.1.dev108,<2"]

[project.optional-dependencies]
http = ["httpx>=0.27,<1"]

[project.urls]
Repository = "https://github.com/MirrorNeuronLab/mn-surface"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
mirrorneuron-sdk-contracts = { path = "../mn-python-sdk/packages/contracts" }
